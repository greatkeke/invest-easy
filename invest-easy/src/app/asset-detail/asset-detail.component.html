<div class="min-h-screen">
  <app-top-navigation title="My Assets" (back)="goBack()" (refresh)="refreshData()">
  </app-top-navigation>

  <div *ngIf="isLoading" class="fixed inset-0 bg-opacity-80 flex items-center justify-center z-50">
    <p-progressSpinner styleClass="w-16 h-16 border-red-500" strokeWidth="4" animationDuration="1s">
    </p-progressSpinner>
  </div>

  <!-- Account Balances Accordion -->
  <div class="p-4">
    <div class="rounded-lg shadow p-6">
      <h2 class="text-md font-medium mb-4">Account Balances</h2>
      <p-accordion [multiple]="true" [(value)]="expand_id" class="w-full">
        <p-accordion-panel *ngFor="let account of accountBalances" [value]="account.id">
          <p-accordion-header>{{account.name}}</p-accordion-header>
          <p-accordion-content>
            <div class="grid grid-cols-2 gap-4 p-3">
              <div class="text-gray-600">Balance:</div>
              <div class="text-right">
                {{account.balance ? (account.balance | number:'1.2-2') + ' ' + account.ccy : 'N/A'}}
              </div>
            </div>
          </p-accordion-content>
        </p-accordion-panel>
      </p-accordion>
    </div>
  </div>

  <div class="p-4">
    <div class="rounded-lg shadow p-6">
      <h2 class="text-md font-medium mb-4">Record History</h2>
      <div class="space-y-4">
        <app-history></app-history>
      </div>
    </div>
  </div>
</div>
