<app-top-navigation [title]="groupName"></app-top-navigation>
<div class="p-4 max-w-3xl mx-auto">
  <form [formGroup]="form" class="flex flex-col space-y-2">
    <p-card *ngFor="let item of items" class="" [header]="item.name">
      <ng-container [ngSwitch]="item.type">
        <!-- Text Input -->
        <input pInputText *ngSwitchCase="'TEXT'" [id]="item.name" [formControlName]="item.name" styleClass="w-full" />

        <!-- Number Input -->
        <p-inputNumber *ngSwitchCase="'NUMBER'" [id]="item.name" [formControlName]="item.name" styleClass="w-full">
        </p-inputNumber>

        <!-- Boolean Checkbox -->
        <div *ngSwitchCase="'BOOLEAN'">
          <p-checkbox [binary]="true" [inputId]="item.name" trueValue="true" falseValue="false"
            [formControlName]="item.name" [readonly]="!item.editable">
          </p-checkbox>
          <label [for]="item.name" class="ml-2">{{item.name}}</label>
        </div>

        <!-- Email Input -->
        <input pInputText *ngSwitchCase="'EMAIL'" [id]="item.name" [formControlName]="item.name" styleClass="w-full"
          type="email" />

        <!-- Phone Input -->
        <p-inputMask *ngSwitchCase="'PHONE'" [id]="item.name" [formControlName]="item.name" mask="(999) 999-9999"
          styleClass="w-full">
        </p-inputMask>

        <!-- Address Textarea -->
        <textarea pTextarea *ngSwitchCase="'ADDRESS'" [id]="item.name" [formControlName]="item.name"
          styleClass="w-full">
        </textarea>

        <!-- Options -->
        <div *ngSwitchCase="'OPTIONS'">
          <div *ngFor="let option of getOptions(item.item_value)">
            <p-checkbox [formControlName]="item.name" [value]="option" [inputId]="option" />
            <label [for]="option" class="ml-2">{{option}}</label>
          </div>
        </div>

        <!-- Single -->
        <div *ngSwitchCase="'SINGLE'">
          <small>{{item.note}}</small>
          <p-select [formControlName]="item.name" [options]="getOptions(item.item_value)"  [placeholder]="item.note"
            class="w-full" />
        </div>
      </ng-container>
    </p-card>

    <div class="w-full my-4">
      <p-button label="Save" (click)="onSave()" styleClass="w-full"></p-button>
    </div>
  </form>
</div>


<!-- Security Tip -->
<p-toast [breakpoints]="{ '768px': { width: '100%', right: '0', left: '0' } }"></p-toast>
