<div class="orders-container">
  <p-table [value]="orders()" [scrollable]="true" scrollHeight="flex" [rows]="10"
    dataKey="id" styleClass="p-datatable-striped" stripedRows>
    <ng-template #header>
      <tr>
        <th>Status</th>
        <th>Name</th>
        <th>Price</th>
        <th>QTY/Filled</th>
      </tr>
    </ng-template>

    <ng-template #body let-order let-expanded="expanded">
      <tr [pRowToggler]="order">
        <td>
          <small [class]="getStatusSeverity(order.status)">{{order.status}}</small>
        </td>
        <td>
          <div class="line-clamp-1 text-ellipsis">{{order.name}}</div>
        </td>
        <td>{{order.price}}</td>
        <td>{{order.quantity}}/{{order.filled}}</td>
      </tr>
    </ng-template>

    <ng-template #expandedrow let-order>
      <tr>
        <td colspan="4" class="button-container">
          <p-button label="Quotes" size="small" variant="outlined" styleClass="mr-2"
          (click)="navigateTo('/trade-stocks',{code: order.code})" />
          <p-button label="Edit" size="small" variant="outlined" styleClass="mr-2"
          [disabled]="order.status == 'FILLED'" />
          <p-button label="Cancel" size="small" variant="outlined" styleClass="mr-2"
          [disabled]="order.status == 'FILLED'" />
          <p-button label="Details" size="small" variant="outlined" styleClass=""
          (click)="navigateTo('/order-detail',{id:order.id})" />
        </td>
      </tr>
    </ng-template>

    <ng-template #footer>
      <tr>
        <td colspan="4">
          <small>In total there are {{ orders() ? orders().length : 0 }} orders. </small>
        </td>
      </tr>
    </ng-template>
  </p-table>

  <div class="load-more-container">
    @if (!allLoaded()) {
      <div class="load-more" (click)="loadOrders()">
        @if (loading()) {
          <i class="pi pi-spinner pi-spin text-red-500 mr-2"></i>
        }
        <small class="text-stone-500">Load more orders</small>
      </div>
    }
    @if (allLoaded() && !loading()) {
      <div class="all-loaded">
        All orders loaded
      </div>
    }
  </div>
</div>
