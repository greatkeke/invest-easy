<div class="overflow-y-auto h-full">
  @for (notification of notifications(); track notification) {
    <div class="p-4 border-b cursor-pointer hover:bg-gray-100"
      (click)="markAsRead(notification)">
      <div class="flex items-start">
        @if (!notification.read) {
          <div class="w-2 h-2 bg-red-500 rounded-full mt-2 mr-2 absolute left-4"></div>
        }
        <div class="w-full">
          <div class="font-semibold">{{ notification.title }}</div>
          <div class="text-gray-600 max-h-12 overflow-hidden transition-all duration-300 ease-in-out"
            [class.max-h-full]="notification.expanded" [innerHTML]="notification.content">
          </div>
          <div class="text-xs text-gray-400 mt-1">{{ notification.date | date:'short' }}</div>
          <div class="text-xs text-red-500 mt-1 cursor-pointer" (click)="toggleExpand(notification); $event.stopPropagation()">
            {{ notification.expanded ? 'Show less' : 'Show more' }}
          </div>
        </div>
      </div>
    </div>
  }
</div>
